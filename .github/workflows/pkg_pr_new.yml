name: Publish Any Commit
on: [push, pull_request]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: corepack enable
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build
        run: vp pack

      - name: Remove devEngines for npm compatibility
        run: node -e "const p=require('./package.json');delete p.devEngines;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - run: vp exec pkg-pr-new publish --commentWithSha